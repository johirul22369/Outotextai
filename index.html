<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 OWNER OF JOY - Manual Signal Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background: #05070c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .panel-box {
            width: 100%;
            max-width: 410px;
            background: radial-gradient(circle at top, #241b00, #080602);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.35);
            text-align: center;
        }

        .panel-header h2 {
            color: #ffd700;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            margin-bottom: 4px;
        }

        .panel-header p {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-bottom: 12px;
        }

        /* লাইভ পিরিয়ড ও টাইমার বার */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            color: #ffd700;
        }

        .section-label {
            text-align: left;
            font-size: 0.78rem;
            color: #facc15;
            font-weight: 700;
            margin-bottom: 6px;
            margin-left: 2px;
        }

        /* BIG / SMALL মেইন বাটন */
        .main-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .action-btn {
            padding: 12px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.15s;
        }

        .btn-big {
            background: linear-gradient(135deg, #991b1b, #ef4444);
            color: #fff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .btn-small {
            background: linear-gradient(135deg, #065f46, #10b981);
            color: #fff;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .action-btn.active {
            border-color: #ffd700;
            transform: scale(1.03);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.8);
        }

        /* অপশনাল কালার বাটন */
        .opt-color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .opt-btn {
            padding: 8px 4px;
            border-radius: 10px;
            background: #121212;
            border: 1.5px solid #333;
            color: #cbd5e1;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
        }

        .opt-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }

        /* অপশনাল নাম্বার বাটন (0-9) */
        .num-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .num-btn {
            padding: 7px 0;
            border-radius: 8px;
            background: #121212;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
        }

        .num-btn.active {
            background: #ffd700;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px #ffd700;
        }

        /* সিগন্যাল আউটপুট বক্স */
        .signal-output-box {
            background: #000;
            border: 1.5px dashed #ffd700;
            border-radius: 14px;
            padding: 14px 12px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #00ffcc;
            white-space: pre-wrap;
            text-align: left;
            line-height: 1.5;
            box-shadow: inset 0 0 12px rgba(0, 255, 204, 0.15);
            margin-bottom: 14px;
        }

        /* কপি বাটন */
        .btn-copy {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
            border: none;
            border-radius: 12px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.92rem;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:active {
            transform: scale(0.97);
        }

        .toast {
            margin-top: 10px;
            color: #00ff66;
            font-size: 0.8rem;
            font-weight: 700;
            display: none;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }
    </style>
</head>
<body>

    <div class="panel-box">
        <div class="panel-header">
            <h2>👑 𝗢𝗪𝗡𝗘𝗥 𝗢𝗙 𝗝𝗢𝗬【𝟐𝐱™️】</h2>
            <p>Manual Analysis Signal Generator (30S)</p>
        </div>

        <!-- লাইভ পিরিয়ড ও টাইমার -->
        <div class="status-bar">
            <span id="livePeriodLabel">PERIOD: ------</span>
            <span id="timerDisplay">⏳ 30s</span>
        </div>

        <!-- ১. মেইন সিগন্যাল (BIG / SMALL) -->
        <div class="section-label">🎯 সিগন্যাল সিলেক্ট করুন (BIG / SMALL):</div>
        <div class="main-btn-grid">
            <button class="action-btn btn-small active" id="btnSmall" onclick="selectSize('SMALL')">SMALL 🟢 GREEN</button>
            <button class="action-btn btn-big" id="btnBig" onclick="selectSize('BIG')">BIG 🔴 RED</button>
        </div>

        <!-- ২. অপশনাল কালার -->
        <div class="section-label">🎨 কালার (Optional):</div>
        <div class="opt-color-grid">
            <button class="opt-btn active" id="colNone" onclick="selectColor('NONE')">NONE (বাদ)</button>
            <button class="opt-btn" id="colGreen" onclick="selectColor('GREEN 🟢')">GREEN 🟢</button>
            <button class="opt-btn" id="colRed" onclick="selectColor('RED 🔴')">RED 🔴</button>
        </div>

        <!-- ৩. অপশনাল নাম্বার -->
        <div class="section-label">🔢 নাম্বার (Optional):</div>
        <div class="num-grid" id="numGrid">
            <button class="num-btn active" onclick="selectNum('NONE', this)">OFF</button>
            <button class="num-btn" onclick="selectNum('0', this)">0</button>
            <button class="num-btn" onclick="selectNum('1', this)">1</button>
            <button class="num-btn" onclick="selectNum('2', this)">2</button>
            <button class="num-btn" onclick="selectNum('3', this)">3</button>
            <button class="num-btn" onclick="selectNum('4', this)">4</button>
            <button class="num-btn" onclick="selectNum('5', this)">5</button>
            <button class="num-btn" onclick="selectNum('6', this)">6</button>
            <button class="num-btn" onclick="selectNum('7', this)">7</button>
            <button class="num-btn" onclick="selectNum('8', this)">8</button>
            <button class="num-btn" onclick="selectNum('9', this)">9</button>
        </div>

        <!-- জেনারেটেড সিগন্যাল প্রিভিউ বক্স -->
        <div class="signal-output-box" id="signalBox"></div>

        <!-- কপি বাটন -->
        <button class="btn-copy" onclick="copySignalText()">
            📋 COPY SIGNAL FOR CHANNEL
        </button>

        <div class="toast" id="toastMsg">✅ কপি হয়েছে! এখন চ্যানেলে পেস্ট করুন।</div>
    </div>

    <script>
        let selectedSize = 'SMALL';
        let selectedColor = 'NONE';
        let selectedNum = 'NONE';
        let currentPeriodNum = '';
        let currentSignalText = '';

        // ফ্যান্সি বোল্ড ফন্ট কনভার্টার
        function toBoldUnicode(str) {
            const normal = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            const bold   = "𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗";
            return str.split('').map(c => {
                let idx = normal.indexOf(c);
                return idx !== -1 ? bold[idx] : c;
            }).join('');
        }

        function selectSize(size) {
            selectedSize = size;
            document.getElementById('btnSmall').classList.toggle('active', size === 'SMALL');
            document.getElementById('btnBig').classList.toggle('active', size === 'BIG');
            buildSignalText();
        }

        function selectColor(color) {
            selectedColor = color;
            document.getElementById('colNone').classList.toggle('active', color === 'NONE');
            document.getElementById('colGreen').classList.toggle('active', color.includes('GREEN'));
            document.getElementById('colRed').classList.toggle('active', color.includes('RED'));
            buildSignalText();
        }

        function selectNum(num, btnEl) {
            selectedNum = num;
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            buildSignalText();
        }

        function buildSignalText() {
            let titleEmoji = selectedSize === 'SMALL' ? "🔥 𝗦𝗠𝗔𝗟𝗟 𝗦𝗜𝗚𝗡𝗔𝗟 🔥" : "🔥 𝗕𝗜𝗚 𝗦𝗜𝗚𝗡𝗔𝗟 🔥";
            
            // কালার নামসহ টেক্সট ফিক্সড করা
            let sizePart = selectedSize === 'SMALL' ? "𝐁𝐄𝐓 𝐒𝐌𝐀𝐋𝐋 🟢 GREEN" : "𝐁𝐄𝐓 𝐁𝐈𝐆 🔴 RED";
            
            let extraParts = [];
            if (selectedColor !== 'NONE') {
                extraParts.push(toBoldUnicode(selectedColor));
            }
            if (selectedNum !== 'NONE') {
                extraParts.push(`(${toBoldUnicode(selectedNum)})`);
            }

            let finalAction = sizePart;
            if (extraParts.length > 0) {
                finalAction += ` + ${extraParts.join(' ')}`;
            }

            currentSignalText = `${titleEmoji}\n` +
                                `▱▱▱▱▱▱▱▱▱▱▱▱▱▱\n` +
                                `💎 𝐏𝐄𝐑𝐈𝐎𝐃   ➤   📅 ${currentPeriodNum}\n` +
                                `🎯 𝐀𝐂𝐓𝐈𝐎𝐍   ➤   ${finalAction}\n` +
                                `⚡ 𝐖𝐈𝐍𝐆𝐎   ➤   𝟯𝟬𝗦 ⏱️\n` +
                                `▱▱▱▱▱▱▱▱▱▱▱▱▱▱`;

            document.getElementById('signalBox').innerText = currentSignalText;
        }

        function updateTimerAndPeriod() {
            const now = new Date();
            const year = now.getUTCFullYear();
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const day = String(now.getUTCDate()).padStart(2, '0');

            const totalDaySeconds = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
            const totalPeriods30s = Math.floor(totalDaySeconds / 30);
            const sequenceNumber = 100000 + totalPeriods30s + 1;
            
            const newPeriod = `${year}${month}${day}${sequenceNumber}`;
            const remainingSecs = 30 - (totalDaySeconds % 30);

            document.getElementById('timerDisplay').innerText = `⏳ ${remainingSecs}s`;
            document.getElementById('livePeriodLabel').innerText = `PERIOD: ${newPeriod.slice(-5)}`;

            if (newPeriod !== currentPeriodNum) {
                currentPeriodNum = newPeriod;
                buildSignalText();
            }
        }

        function copySignalText() {
            navigator.clipboard.writeText(currentSignalText).then(() => {
                const toast = document.getElementById('toastMsg');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 1800);
            });
        }

        setInterval(updateTimerAndPeriod, 1000);
        window.onload = updateTimerAndPeriod;
    </script>
</body>
</html>
